# -------------------------------------------------------------------
# PURPOSE: Defines the logical Service ID for this application.
# WHY:
# 1. Used by Spring Cloud Config to fetch specific settings.
# 2. Used as the VIP (Virtual IP) for Service Discovery (Eureka/Consul).
# 3. Tags all log entries with this name for debugging.
# -------------------------------------------------------------------
spring.application.name=demowebapp


# -------------------------------------------------------------------
# PURPOSE: Sets the active profile to 'Development'.
# WHY: This ensures the app loads configurations from 'application-dev.properties'
# instead of 'application-prod.properties'.
# SAFETY: Prevents us from accidentally connecting to the live database while coding.
# -------------------------------------------------------------------
spring.profiles.active=dev

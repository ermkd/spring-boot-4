# -------------------------------------------------------------------
# PURPOSE: Defines the Database Connection Settings.
# WHY:
# 1. Establishes the 'physical' link between our Java App and MySQL.
# 2. Spring Boot creates a 'Connection Pool' (HikariCP) using these details
#    so multiple users can access data simultaneously.
#
# URL BREAKDOWN:
# - jdbc:mysql://   -> The Protocol (we are using the MySQL Driver).
# - localhost:3306  -> The Address (Host IP : Port Number).
# - /BASIC...       -> The specific Database Name to open.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/BASICSETUPFORSPRINGBOOT?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# -------------------------------------------------------------------
# PURPOSE: Authentication Credentials.
# WHY: Validates that this application has permission to read/write data.
# LEARNING NOTE: In a real 'Production' environment, these should NEVER
# be hardcoded here. We would use Environment Variables instead.
# -------------------------------------------------------------------
spring.datasource.username=root
spring.datasource.password=123456789


# -------------------------------------------------------------------
# PURPOSE: Schema Management (The "Architect")
# WHY: 'update' checks the Database against our Java Entities.
# If we added a new field in Java, Hibernate automatically adds that
# column to the MySQL table.
# WARNING: In Production, use 'validate' or 'none' to prevent data loss.
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update

# -------------------------------------------------------------------
# PURPOSE: Debugging Transparency
# WHY: Prints the actual SQL queries Hibernate writes for us into the console.
# USEFUL FOR: Checking if our Java logic is generating efficient SQL.
# -------------------------------------------------------------------
spring.jpa.show-sql=true

# -------------------------------------------------------------------
# PURPOSE: SQL Translation Guide
# WHY: Tells Hibernate exactly which version of SQL syntax to speak.
# MySQL has different keywords than Oracle or Postgres; this ensures compatibility.
# -------------------------------------------------------------------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# PURPOSE: Connection Pool Diagnostics
# WHY: Allows us to see logs like "Connection Pool is full" or "Connection leak".
# -------------------------------------------------------------------
logging.level.com.zaxxer.hikari=DEBUG

# -------------------------------------------------------------------
# PURPOSE: Production-Grade Connection Pooling
# LEARNING OBJECTIVE:
# 1. Database connections are expensive to open. We keep a 'pool' of them ready.
# 2. 'minimum-idle=10': Keep 10 connections open even if no one is using the app.
# 3. 'maximum-pool-size=40': Never open more than 40 at once (protects the DB).
# 4. 'max-lifetime': Retire a connection after 30 mins to prevent stale issues.
# 5. 'auto-commit=false': We want to manually control Transactions (begin/commit)
#    for better performance and data integrity.
# -------------------------------------------------------------------
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=false
